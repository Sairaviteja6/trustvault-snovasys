<!-- Dynamic Background Video Layer Per Screen -->
<div class="ambient-video-container" aria-hidden="true">
  <video 
    #bgVideo
    [src]="currentVideo()"
    autoplay 
    muted 
    loop 
    playsinline 
    class="ambient-video-element"
  ></video>
  <div class="ambient-video-overlay"></div>
</div>

<div class="app-shell">
  <app-navbar></app-navbar>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
