version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trustvault-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TrustVault@StrongPass2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TrustVault@StrongPass2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TrustVaultDb;User Id=sa;Password=TrustVault@StrongPass2026!;TrustServerCertificate=True;
      - Jwt__Secret=SuperSecretTrustVaultProductionGradeKey2026!#$StrictCryptoEnforcement
      - Security__MasterEncryptionKeyHex=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
    ports:
      - "5000:5000"
    volumes:
      - encrypted-blobs:/app/Storage/encrypted_blobs

volumes:
  sqlserver-data:
  encrypted-blobs:
