name: Build & Deploy to AWS Auto Scaling

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build Docker Images & Rolling Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and Push Frontend Image
      - name: Build & Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t $ECR_REGISTRY/trustvault-frontend:latest \
            -t $ECR_REGISTRY/trustvault-frontend:${{ github.sha }} \
            ./frontend
          docker push $ECR_REGISTRY/trustvault-frontend:latest
          docker push $ECR_REGISTRY/trustvault-frontend:${{ github.sha }}

      # 2. Build and Push Backend Image
      - name: Build & Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t $ECR_REGISTRY/trustvault-backend:latest \
            -t $ECR_REGISTRY/trustvault-backend:${{ github.sha }} \
            -f ./backend/Dockerfile \
            ./backend
          docker push $ECR_REGISTRY/trustvault-backend:latest
          docker push $ECR_REGISTRY/trustvault-backend:${{ github.sha }}

      # 3. Trigger Zero-Downtime Rolling Instance Refresh on Auto Scaling Groups
      - name: Trigger Auto Scaling Rolling Refresh
        run: |
          echo "Finding Frontend and Backend Auto Scaling Groups..."
          FRONTEND_ASG=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'frontend')].AutoScalingGroupName" --output text | awk '{print $1}')
          BACKEND_ASG=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'backend')].AutoScalingGroupName" --output text | awk '{print $1}')

          echo "Initiating rolling update for Frontend ASG: $FRONTEND_ASG"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$FRONTEND_ASG" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}' || echo "Refresh already active or pending"

          echo "Initiating rolling update for Backend ASG: $BACKEND_ASG"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$BACKEND_ASG" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}' || echo "Refresh already active or pending"

          echo "Deployment triggered successfully! AWS Auto Scaling will roll out new containers automatically."
